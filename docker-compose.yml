version: '3.8'

services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: mizan_user
      POSTGRES_PASSWORD: mizan_password
      POSTGRES_DB: mizan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://mizan_user:mizan_password@db:5432/mizan_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=development_secret_key
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
